<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="0.55" stop-color="#10233d"/>
      <stop offset="1" stop-color="#0b3a4d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22b8e6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22b8e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b7cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd3f2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fd3f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="1" stop-color="#0e2c40"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f47"/>
      <stop offset="1" stop-color="#101d30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22b8e6"/>
      <stop offset="1" stop-color="#5b7cf0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="180" cy="140" r="340" fill="url(#glow1)" filter="url(#soft)"/>
  <circle cx="1020" cy="720" r="380" fill="url(#glow2)" filter="url(#soft)"/>
  <circle cx="880" cy="120" r="260" fill="url(#glow3)" filter="url(#soft)"/>

  <!-- Ambient grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 180H1200M0 360H1200M0 540H1200M0 720H1200"/>
    <path d="M150 0V900M350 0V900M600 0V900M850 0V900M1050 0V900"/>
  </g>

  <!-- Floating decorative cards (left) -->
  <g>
    <rect x="70" y="300" width="230" height="120" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="92" y="326" width="120" height="10" rx="5" fill="#6fd3f2" fill-opacity="0.9"/>
    <rect x="92" y="348" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="92" y="364" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="92" y="392" width="90" height="12" rx="6" fill="url(#bar)"/>
  </g>
  <g>
    <rect x="60" y="470" width="200" height="110" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="105" cy="525" r="22" fill="none" stroke="#5fc794" stroke-width="6" stroke-linecap="round" stroke-dasharray="96 40" transform="rotate(-90 105 525)"/>
    <rect x="140" y="508" width="90" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="140" y="528" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- Central laptop / learning device -->
  <g transform="translate(600 430)">
    <!-- glow behind device -->
    <ellipse cx="0" cy="60" rx="330" ry="60" fill="#22b8e6" fill-opacity="0.18" filter="url(#soft)"/>
    <!-- screen -->
    <rect x="-240" y="-190" width="480" height="300" rx="22" fill="url(#device)" stroke="#3a5578" stroke-width="2"/>
    <rect x="-214" y="-164" width="428" height="248" rx="12" fill="url(#screen)"/>
    <!-- screen content: course UI -->
    <rect x="-214" y="-164" width="428" height="34" rx="12" fill="#0d2436"/>
    <circle cx="-186" cy="-147" r="5" fill="#f2848f"/>
    <circle cx="-168" cy="-147" r="5" fill="#e8b25f"/>
    <circle cx="-150" cy="-147" r="5" fill="#5fc794"/>
    <rect x="-120" y="-152" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <!-- lesson rows -->
    <g>
      <rect x="-190" y="-108" width="360" height="10" rx="5" fill="#6fd3f2" fill-opacity="0.85"/>
      <rect x="-190" y="-88" width="300" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="-190" y="-66" width="330" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="-190" y="-44" width="270" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
      <!-- progress -->
      <rect x="-190" y="-18" width="360" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="-190" y="-18" width="252" height="8" rx="4" fill="url(#bar)"/>
      <rect x="40" y="-26" width="70" height="24" rx="12" fill="#22b8e6" fill-opacity="0.25"/>
      <text x="75" y="-9" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6fd3f2" text-anchor="middle">72%</text>
    </g>
    <!-- webcam dot -->
    <circle cx="0" cy="-206" r="4" fill="#0a1626"/>
    <!-- base -->
    <path d="M-280 110 L280 110 L320 150 L-320 150 Z" fill="url(#device)" stroke="#3a5578" stroke-width="2"/>
    <rect x="-60" y="118" width="120" height="8" rx="4" fill="#2a4258"/>
  </g>

  <!-- Books stack (right) -->
  <g transform="translate(880 560)">
    <rect x="-90" y="60" width="200" height="26" rx="8" fill="#1d3a52" stroke="#33506e" stroke-width="2"/>
    <rect x="-80" y="30" width="180" height="26" rx="8" fill="#274b66" stroke="#3d6080" stroke-width="2"/>
    <rect x="-70" y="0" width="160" height="26" rx="8" fill="#2f5d7c" stroke="#4a7592" stroke-width="2"/>
    <rect x="-58" y="8" width="60" height="10" rx="5" fill="#6fd3f2" fill-opacity="0.7"/>
  </g>

  <!-- Graduation cap (left-bottom) -->
  <g transform="translate(300 640) rotate(-8)">
    <path d="M0 -60 L110 -10 L0 40 L-110 -10 Z" fill="#1d3a52" stroke="#4a7592" stroke-width="3"/>
    <path d="M-110 -10 L0 30 L0 70 L-110 30 Z" fill="#16304a" stroke="#33506e" stroke-width="2"/>
    <path d="M0 40 L110 -10 L110 30 L0 80 Z" fill="#1a3550" stroke="#33506e" stroke-width="2"/>
    <rect x="-6" y="70" width="12" height="34" rx="6" fill="#4a7592"/>
    <circle cx="0" cy="-72" r="10" fill="#22b8e6"/>
  </g>

  <!-- Floating achievement card (right-top) -->
  <g>
    <rect x="820" y="180" width="240" height="130" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <path d="M852 236 l14 14 l26 -30" fill="none" stroke="#5fc794" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="900" y="222" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="900" y="244" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="852" y="272" width="150" height="12" rx="6" fill="url(#bar)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#6fd3f2">
    <path d="M520 240 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z" opacity="0.8"/>
    <path d="M980 420 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z" opacity="0.6"/>
    <path d="M240 180 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 Z" opacity="0.5"/>
    <circle cx="430" cy="120" r="4" opacity="0.5"/>
    <circle cx="760" cy="700" r="5" opacity="0.4"/>
    <circle cx="150" cy="640" r="4" opacity="0.45"/>
  </g>
</svg>
